<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChalaScrape</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <h1>ChalaScrape</h1>
    <button id="planBtn" class="badge" type="button"></button>
  </header>

  <main>
    <section class="card">
      <div class="row">
        <button id="detectBtn" class="primary" type="button" data-i18n="detect"></button>
        <button id="cycleBtn" type="button" data-i18n="cycle"></button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2><span data-i18n="pagination"></span> <span class="pro-tag">PRO</span></h2>
      <label class="field">
        <span data-i18n="mode"></span>
        <select id="mode">
          <option value="next" data-i18n="modeNext"></option>
          <option value="scroll" data-i18n="modeScroll"></option>
        </select>
      </label>
      <div id="nextRow" class="row">
        <button id="pickBtn" type="button" data-i18n="pickNext"></button>
        <span id="nextLabel" class="muted"></span>
      </div>
      <label class="field">
        <span><span data-i18n="delay"></span>: <output id="delayOut" for="delay"></output></span>
        <input id="delay" type="range" min="1.5" max="3" step="0.1">
      </label>
      <button id="runBtn" class="primary" type="button"></button>
    </section>

    <section class="card">
      <h2><span data-i18n="preview"></span> <span id="counts" class="counter"></span></h2>
      <p id="empty" class="muted" data-i18n="empty"></p>
      <div id="tableWrap" class="table-wrap" tabindex="0">
        <table id="grid"><thead></thead><tbody></tbody></table>
      </div>
      <p id="more" class="muted"></p>
    </section>
  </main>

  <footer>
    <button id="csvBtn" class="primary" type="button" data-i18n="exportCsv"></button>
    <button id="xlsxBtn" type="button"><span data-i18n="exportXlsx"></span> <span class="pro-tag">PRO</span></button>
    <button id="clearBtn" class="ghost" type="button" data-i18n="clear"></button>
  </footer>

  <dialog id="licenseDlg" aria-labelledby="licTitle">
    <h2 id="licTitle" data-i18n="licTitle"></h2>
    <ul>
      <li data-i18n="licB1"></li>
      <li data-i18n="licB2"></li>
      <li data-i18n="licB3"></li>
    </ul>
    <form id="licForm">
      <label for="licKey" data-i18n="licKeyLabel"></label>
      <input id="licKey" autocomplete="off" spellcheck="false" required>
      <div class="row">
        <button id="licActivate" class="primary" type="submit" data-i18n="licActivate"></button>
        <a id="licBuy" target="_blank" rel="noopener" data-i18n="licBuy"></a>
      </div>
    </form>
    <div id="licActive">
      <p data-i18n="licActiveMsg"></p>
      <button id="licRemove" type="button" data-i18n="licRemove"></button>
    </div>
    <p id="licMsg" role="alert"></p>
    <button id="licClose" class="ghost" type="button" data-i18n="close"></button>
  </dialog>

  <script src="../lib/xlsx.full.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
