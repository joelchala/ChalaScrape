<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChalaScrape Pro</title>
  <style>
    :root { --primary: #10B981; --accent: #06B6D4; --bg: #0F172A; --surface: #1E293B; --border: #334155; --text: #F8FAFC; --muted: #94A3B8; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .price { color: var(--accent); font-size: 28px; font-weight: 700; margin: 8px 0; }
    ul { color: var(--muted); padding-left: 20px; margin: 0 0 20px; }
    #paypal { background: #fff; border-radius: 10px; padding: 12px 12px 4px; min-height: 60px; }
    #msg { min-height: 1.5em; margin: 12px 0 0; color: var(--muted); }
    #done code { display: block; margin: 12px 0; padding: 12px; background: var(--bg); border: 1px solid var(--primary); border-radius: 10px; font-size: 18px; text-align: center; word-break: break-all; user-select: all; }
    button { font: inherit; font-weight: 600; cursor: pointer; background: var(--primary); color: var(--bg); border: 0; border-radius: 8px; padding: 8px 14px; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>ChalaScrape Pro</h1>
    <div class="price" id="price">&nbsp;</div>
    <ul>
      <li data-t="b1"></li>
      <li data-t="b2"></li>
      <li data-t="b3"></li>
    </ul>
    <div id="buy">
      <div id="paypal"></div>
      <p id="msg" role="status" aria-live="polite"></p>
    </div>
    <div id="done" hidden>
      <p data-t="thanks"></p>
      <code id="key"></code>
      <button id="copy" type="button" data-t="copy"></button>
      <p data-t="how" style="color: var(--muted)"></p>
    </div>
  </main>

  <script>
    const TEXT = {
      es: {
        b1: 'Filas ilimitadas por archivo', b2: 'Paginación automática y scroll infinito', b3: 'Exportación nativa a Excel (.xlsx)',
        thanks: '¡Gracias por tu compra! Esta es tu clave de licencia. Guárdala: es la única vez que se muestra.',
        copy: 'Copiar clave', copied: '¡Copiada!',
        how: 'En ChalaScrape pulsa la insignia FREE, pega la clave y pulsa «Activar».',
        loading: 'Cargando PayPal…', failed: 'No se pudo completar el pago. No se te cobró; inténtalo de nuevo.',
        down: 'La tienda no está disponible en este momento.',
      },
      en: {
        b1: 'Unlimited rows per file', b2: 'Auto-pagination and infinite scroll', b3: 'Native Excel (.xlsx) export',
        thanks: 'Thank you! This is your license key. Save it: it is only shown once.',
        copy: 'Copy key', copied: 'Copied!',
        how: 'In ChalaScrape click the FREE badge, paste the key and press "Activate".',
        loading: 'Loading PayPal…', failed: 'The payment could not be completed. You were not charged; please try again.',
        down: 'The store is unavailable right now.',
      },
    };
    const lang = navigator.language.startsWith('es') ? 'es' : 'en';
    const t = TEXT[lang];
    const $ = (id) => document.getElementById(id);
    document.documentElement.lang = lang;
    for (const el of document.querySelectorAll('[data-t]')) el.textContent = t[el.dataset.t];

    const api = (action, body) => fetch('/api/paypal' + (action ? '?do=' + action : ''), action && {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}),
    }).then((r) => r.json());

    $('copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText($('key').textContent);
      $('copy').textContent = t.copied;
    });

    (async () => {
      $('msg').textContent = t.loading;
      try {
        const cfg = await api();
        if (!cfg.clientId) throw new Error('sin configurar');
        $('price').textContent = new Intl.NumberFormat(lang, { style: 'currency', currency: cfg.currency }).format(cfg.price);
        await new Promise((ok, fail) => {
          const s = document.createElement('script');
          s.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(cfg.clientId)}&currency=${encodeURIComponent(cfg.currency)}`;
          s.onload = ok;
          s.onerror = fail;
          document.head.append(s);
        });
        $('msg').textContent = '';
        paypal.Buttons({
          createOrder: async () => {
            const order = await api('create');
            if (!order.id) throw new Error(order.error);
            return order.id;
          },
          onApprove: async ({ orderID }) => {
            const res = await api('capture', { orderID });
            if (!res.key) return void ($('msg').textContent = t.failed);
            $('key').textContent = res.key;
            $('buy').hidden = true;
            $('done').hidden = false;
          },
          onError: () => { $('msg').textContent = t.failed; },
        }).render('#paypal');
      } catch {
        $('msg').textContent = t.down;
      }
    })();
  </script>
</body>
</html>
