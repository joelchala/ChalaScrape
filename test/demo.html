<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mercado Demo — catálogo</title>
<!-- Página ficticia para las capturas de la tienda (store/screenshots). Nombres, precios y contactos son inventados. -->
<style>
  body { margin: 0; background: #F1F5F9; color: #0F172A; font: 15px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { background: #fff; border-bottom: 1px solid #E2E8F0; padding: 14px 28px; display: flex; align-items: center; gap: 24px; }
  header b { font-size: 20px; } header nav { color: #64748B; display: flex; gap: 18px; }
  main { padding: 20px 28px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 26px; }
  .card { background: #fff; border: 1px solid #E2E8F0; border-radius: 10px; padding: 10px; }
  .thumb { height: 74px; border-radius: 8px; margin-bottom: 8px; }
  .name { display: block; font-weight: 600; color: #0F172A; text-decoration: none; }
  .category { color: #64748B; font-size: 13px; }
  .price { font-weight: 700; margin-top: 4px; }
  .rating { color: #D97706; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #E2E8F0; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #E2E8F0; }
  th { background: #F8FAFC; }
  .pager { margin-top: 14px; display: flex; gap: 8px; }
  .pager button { font: inherit; padding: 6px 14px; border: 1px solid #CBD5E1; border-radius: 8px; background: #fff; }
</style>
</head>
<body>
<header><b>Mercado Demo</b><nav><span>Catálogo</span><span>Ofertas</span><span>Sucursales</span><span>Ayuda</span></nav></header>
<main>
  <h2>Productos destacados</h2>
  <div class="grid" id="grid"></div>
  <h2>Sucursales</h2>
  <table>
    <thead><tr><th>Sucursal</th><th>Ciudad</th><th>Teléfono</th><th>Horario</th></tr></thead>
    <tbody id="branches"></tbody>
  </table>
  <div class="pager"><button type="button">‹ Anterior</button><button type="button">Siguiente ›</button></div>
</main>
<script>
  const products = [
    ['Cafetera de émbolo 1 L', 'Cocina', 24.9, 4.7], ['Lámpara de escritorio LED', 'Oficina', 32.5, 4.5],
    ['Mochila urbana 20 L', 'Viaje', 48, 4.8], ['Audífonos inalámbricos', 'Audio', 59.99, 4.4],
    ['Termo de acero 750 ml', 'Cocina', 19.5, 4.6], ['Teclado mecánico compacto', 'Oficina', 74.9, 4.7],
    ['Silla plegable de camping', 'Aire libre', 27, 4.2], ['Bocina portátil resistente', 'Audio', 41.75, 4.5],
    ['Set de cuchillos, 6 piezas', 'Cocina', 36.4, 4.3], ['Organizador de cables', 'Oficina', 9.99, 4.1],
    ['Linterna recargable', 'Aire libre', 15.25, 4.6], ['Maleta de cabina 40 L', 'Viaje', 89, 4.8],
  ];
  const hues = [160, 190, 215, 250, 28, 340];
  document.getElementById('grid').innerHTML = products.map(([name, cat, price, rating], i) => `
    <article class="card">
      <div class="thumb" style="background: linear-gradient(135deg, hsl(${hues[i % 6]} 70% 62%), hsl(${hues[(i + 2) % 6]} 70% 46%))"></div>
      <a class="name" href="https://mercado-demo.example/producto/${i + 101}">${name}</a>
      <div class="category">${cat}</div>
      <div class="price">US$ ${price.toFixed(2)}</div>
      <div class="rating">★ ${rating.toFixed(1)}</div>
    </article>`).join('');
  const branches = [
    ['Centro', 'Santo Domingo', '809-555-0101', 'Lun–Sáb 9:00–19:00'], ['Naco', 'Santo Domingo', '809-555-0102', 'Lun–Dom 10:00–20:00'],
    ['Los Jardines', 'Santiago', '809-555-0103', 'Lun–Sáb 9:00–18:00'], ['Malecón', 'Puerto Plata', '809-555-0104', 'Lun–Sáb 9:00–18:00'],
    ['Bávaro', 'Punta Cana', '809-555-0105', 'Lun–Dom 9:00–21:00'], ['Zona Colonial', 'Santo Domingo', '809-555-0106', 'Mar–Dom 10:00–19:00'],
  ];
  document.getElementById('branches').innerHTML = branches.map((b) => `<tr>${b.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('');
</script>
</body>
</html>
